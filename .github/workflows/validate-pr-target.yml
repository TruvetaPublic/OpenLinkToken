name: Validate PR Target

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-target:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR is from release branch
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;

            // The event payload is frozen at creation, so reruns can see a stale base after retargeting.
            const { data: current } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            const baseRef = current.base.ref;

            console.log(`Validating PR #${pr.number}`);
            console.log(`Head branch: ${headRef}`);
            console.log(`Base branch: ${baseRef}`);

            if (baseRef !== 'main') {
              console.log(`PR no longer targets main (now '${baseRef}'), nothing to validate.`);
              return;
            }

            // Check if the head branch matches release/* pattern
            if (!headRef.startsWith('release/')) {
              core.setFailed(
                `❌ PRs to main must come from release/* branches.\n\n` +
                `Current head branch: ${headRef}\n\n` +
                `Standard development work should target the 'develop' branch.\n` +
                `Only release PRs from 'release/x.y.z' branches can target 'main'.\n\n` +
                `This PR may be automatically retargeted to 'develop' by our automation. If it is not, please close this PR and open a new one targeting 'develop' instead.`
              );
              return;
            }

            console.log(`✅ PR is from a release branch (${headRef}), validation passed.`);
