name: Build Open Link Token CLI (PyInstaller)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build/release (e.g., 1.12.5)"
        required: false
        type: string
      model_tag:
        description: "ML1 OCI model tag to verify (default: v1)"
        required: false
        default: v1
        type: string
  push:
    branches:
      - main
  release:
    types: [created, published]
  workflow_run:
    workflows: ["Create Release on Merge"]
    types: [completed]

permissions:
  contents: read

jobs:
  release-info:
    uses: ./.github/workflows/release-context.yml
    secrets: inherit
    with:
      lookup-release: ${{ github.event_name != 'push' }}
      release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version && format('v{0}', github.event.inputs.version) || '' }}

  build:
    needs: release-info
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build (${{ matrix.os }} / ${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
            python-version: "3.11"
          - os: macos-15-intel
            architecture: x86_64
            python-version: "3.10"
          - os: macos-15
            architecture: arm64
            python-version: "3.11"
          - os: windows-latest
            architecture: x86_64
            python-version: "3.11"

    env:
      VERSION: ${{ needs.release-info.outputs.version }}
      TAG: ${{ needs.release-info.outputs.tag }}
      RELEASE_FOUND: ${{ needs.release-info.outputs['release-found'] }}
      RELEASE_ID: ${{ needs.release-info.outputs['release-id'] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ needs.release-info.outputs['release-found'] == 'true' && needs.release-info.outputs.tag || github.sha }}

      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash install.sh --help

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\install.ps1 -Help

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up UV
        uses: astral-sh/setup-uv@v7

      - name: Install build dependencies
        run: |
          uv sync --all-packages

      - name: Build CLI binary
        shell: bash
        run: |
          uv run pyinstaller --clean --noconfirm lib/python/openlinktoken-cli/openlinktoken-cli.spec

      - name: Smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke
          cp resources/sample.csv smoke/input.csv
          ./dist/olt/olt generate-key-pair --name recipient --force
          ./dist/olt/olt initiate-exchange --name smoke --public-key "$HOME/.openlinktoken/recipient.public.pem" --output smoke/smoke.exchange.json --hashingsecret secret
          ./dist/olt/olt tokenize -i smoke/input.csv -o smoke/out.csv --exchange-config smoke/smoke.exchange.json --private-key "$HOME/.openlinktoken/smoke.private.pem"
          python - smoke/out.csv <<'PY'
          import csv
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open(newline="", encoding="utf-8") as file_handle:
              ml1_tokens = [
                  row["Token"]
                  for row in csv.DictReader(file_handle)
                  if row.get("RuleId") == "ML1" and row.get("Token")
              ]
          if not ml1_tokens or any(token == "0" * 64 for token in ml1_tokens):
              raise SystemExit("Frozen CLI output does not contain a non-blank ML1 token")
          PY

      - name: Verify CUDA provider on Linux GPU runners
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/nvidia0 || -e /dev/nvidiactl ]]; then
            latest_log=$(find "$HOME/.openlinktoken/logs" -type f -name '*tokenize*.log' -print | sort | tail -n 1)
            test -n "$latest_log"
            grep -q "ML1 ONNX: CUDA execution provider active" "$latest_log"
          else
            echo "No NVIDIA device is available on this runner; CUDA smoke check skipped."
          fi

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item resources\sample.csv smoke\input.csv
          .\dist\olt\olt.exe generate-key-pair --name recipient --force
          .\dist\olt\olt.exe initiate-exchange --name smoke --public-key "$HOME/.openlinktoken/recipient.public.pem" --output smoke\smoke.exchange.json --hashingsecret secret
          .\dist\olt\olt.exe tokenize -i smoke\input.csv -o smoke\out.csv --exchange-config smoke\smoke.exchange.json --private-key "$HOME/.openlinktoken/smoke.private.pem"
          $ml1Tokens = Import-Csv smoke\out.csv | Where-Object { $_.RuleId -eq "ML1" -and $_.Token -and $_.Token -ne ("0" * 64) }
          if (-not $ml1Tokens) {
            throw "Frozen CLI output does not contain a non-blank ML1 token"
          }

      - name: Measure standalone startup
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            uv run python tools/cli/measure_startup.py --executable dist/olt/olt.exe --output startup-measurements.json
          else
            uv run python tools/cli/measure_startup.py --executable dist/olt/olt --output startup-measurements.json
          fi

      - name: Upload startup measurements
        uses: actions/upload-artifact@v7
        with:
          name: olt-cli-startup-${{ matrix.os }}-${{ matrix.architecture }}
          path: startup-measurements.json
          if-no-files-found: error

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m openlinktoken_cli.util.release_assets \
            --version "${VERSION}" \
            --runner-os "${{ runner.os }}" \
            --architecture "${{ matrix.architecture }}" \
            --dist-dir dist \
            --output-dir release-assets

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.3

      - name: Verify OCI model assets and release ZIP
        shell: bash
        env:
          MODEL_TAG: ${{ github.event.inputs.model_tag || 'v1' }}
        run: |
          set -euo pipefail
          mkdir -p smoke/model-assets
          oras pull "ghcr.io/truvetapublic/openlinktoken-ml1-assets:${MODEL_TAG}" \
            --output smoke/model-assets
          python - "${VERSION}" "${{ runner.os }}" "${{ matrix.architecture }}" <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          version, runner_os, architecture = sys.argv[1:]
          platform = {
              "Linux": "linux-x64",
              "macOS": f"macos-{architecture}",
              "Windows": "windows-x64",
          }[runner_os]
          package = f"olt-cli-{version}-{platform}"
          archive_path = Path("release-assets") / f"{package}.zip"
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              model_files = ("asset-manifest.json", "model.onnx", "model.onnx.data", "tokenizer.json")
              if any(name.endswith(model_files) for name in names):
                  raise SystemExit(f"{archive_path} unexpectedly includes ML1 model files")
              archive.extractall("smoke/release-bundle")

          model_root = Path("smoke/release-bundle") / package / "_internal/openlinktoken/core/ai/tokens"
          asset_directory = Path("smoke/model-assets")
          manifest = json.loads((asset_directory / "asset-manifest.json").read_text(encoding="utf-8"))
          required_files = {"asset-manifest.json", "model.onnx", "model.onnx.data", "tokenizer.json"}
          asset_names = required_files - {"asset-manifest.json"}
          if not isinstance(manifest.get("assets"), dict) or set(manifest["assets"]) != asset_names:
              raise SystemExit("OCI model package does not contain the required ML1 assets")
          for filename, metadata in manifest["assets"].items():
              asset_path = asset_directory / filename
              if not asset_path.is_file() or asset_path.stat().st_size != metadata["size"]:
                  raise SystemExit(f"Missing or incorrectly sized OCI model asset: {filename}")
              digest = hashlib.sha256()
              with asset_path.open("rb") as asset_file:
                  for chunk in iter(lambda: asset_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != metadata["sha256"]:
                  raise SystemExit(f"OCI model asset checksum mismatch: {filename}")
          model_root.mkdir(parents=True, exist_ok=True)
          for filename in required_files:
              shutil.copy2(asset_directory / filename, model_root / filename)
          PY

      - name: Smoke test CPU-only Linux release bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/cpu-only
          cpu_cli="smoke/release-bundle/olt-cli-${VERSION}-linux-x64/olt"
          chmod 0755 "$cpu_cli"
          "$cpu_cli" tokenize \
            -i smoke/input.csv \
            -o smoke/cpu-only/out.csv \
            --exchange-config smoke/smoke.exchange.json \
            --private-key "$HOME/.openlinktoken/smoke.private.pem"
          python - smoke/cpu-only/out.csv <<'PY'
          import csv
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open(newline="", encoding="utf-8") as file_handle:
              ml1_tokens = [
                  row["Token"]
                  for row in csv.DictReader(file_handle)
                  if row.get("RuleId") == "ML1" and row.get("Token")
              ]
          if not ml1_tokens or any(token == "0" * 64 for token in ml1_tokens):
              raise SystemExit("CPU-only CLI bundle did not generate a non-blank ML1 token")
          PY

      - name: Add bootstrap installers
        if: runner.os == 'Linux'
        shell: bash
        run: cp install.sh install.ps1 release-assets/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: olt-cli-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload release assets
        if: env.RELEASE_FOUND == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const assetDir = 'release-assets';
            const tag = '${{ env.TAG }}';
            let releaseId = '${{ env.RELEASE_ID }}';

            if (!releaseId) {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              releaseId = release.data.id;
            }

            const files = fs.readdirSync(assetDir)
              .sort((left, right) => {
                const rank = (name) => {
                  if (name.endsWith('.zip.sha256')) return 3;
                  if (name.endsWith('.zip')) return 2;
                  if (name.endsWith('.sha256')) return 1;
                  return 0;
                };
                return rank(left) - rank(right) || left.localeCompare(right);
              })
              .map((name) => path.join(assetDir, name))
              .filter((filePath) => fs.statSync(filePath).isFile());

            if (files.length === 0) {
              throw new Error(`No CLI release assets found in ${assetDir}`);
            }

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            const existingAssets = new Map(release.data.assets.map((asset) => [asset.name, asset.id]));

            for (const filePath of files) {
              const name = path.basename(filePath);
              const size = fs.statSync(filePath).size;
              if (size > 1536 * 1024 * 1024) {
                throw new Error(`Release asset ${name} exceeds the 1.5 GiB upload limit (${size} bytes)`);
              }
              const existingAssetId = existingAssets.get(name);

              if (existingAssetId) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existingAssetId,
                });
              }

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name,
                data: fs.readFileSync(filePath),
              });

              console.log(`Uploaded ${name} (${size} bytes)`);
            }
