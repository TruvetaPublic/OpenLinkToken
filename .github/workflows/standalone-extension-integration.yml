name: Standalone extension integration

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Core branch, tag or SHA (default: selected workflow ref)"
        type: string
      extension_ref:
        description: "Extension branch, tag or SHA (default: tested baseline)"
        type: string
        default: "ccf5ee7a862c3b7ac951678b020a21e773e9eb3a"

permissions:
  contents: read

jobs:
  integration:
    # Pin workflow code and counterpart source together; update deliberately.
    uses: TruvetaPublic/OpenLinkToken-Truveta-Extension/.github/workflows/standalone-integration.yml@ccf5ee7a862c3b7ac951678b020a21e773e9eb3a
    with:
      core_ref: ${{ inputs.core_ref || github.event.pull_request.head.sha || github.sha }}
      extension_ref: ${{ inputs.extension_ref || 'ccf5ee7a862c3b7ac951678b020a21e773e9eb3a' }}
