name: Publish ML1 Assets

on:
  workflow_dispatch:
    inputs:
      model_tag:
        description: "Immutable model tag, for example v1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PACKAGE_SUFFIX: ml1-assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out model assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Validate model tag
        env:
          MODEL_TAG: ${{ inputs.model_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${MODEL_TAG}" =~ ^v[0-9]+$ ]]; then
            echo "model_tag must match vN, for example v1." >&2
            exit 1
          fi

      - name: Validate model assets
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          asset_dir = Path("resources/inferencing/ml1")
          manifest = json.loads((asset_dir / "asset-manifest.json").read_text(encoding="utf-8"))

          for filename, metadata in manifest["assets"].items():
              path = asset_dir / filename
              if not path.is_file():
                  raise SystemExit(f"Missing ML1 asset: {path}")
              if path.stat().st_size != metadata["size"]:
                  raise SystemExit(f"Unexpected size for {path}")

              digest = hashlib.sha256()
              with path.open("rb") as asset_file:
                  for chunk in iter(lambda: asset_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != metadata["sha256"]:
                  raise SystemExit(f"Unexpected SHA-256 digest for {path}")
          PY

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | oras login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish ML1 OCI artifact
        env:
          MODEL_TAG: ${{ inputs.model_tag }}
        run: |
          set -euo pipefail
          package="${REGISTRY}/${GITHUB_REPOSITORY,,}-${PACKAGE_SUFFIX}"
          cd resources/inferencing/ml1
          oras push "${package}:${MODEL_TAG}" \
            --artifact-type application/vnd.openlinktoken.ml1.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "model.onnx:application/octet-stream" \
            "model.onnx.data:application/octet-stream" \
            "tokenizer.json:application/json" \
            "asset-manifest.json:application/json"

          {
            echo "### ML1 OCI artifact"
            echo
            echo "\`${package}:${MODEL_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
